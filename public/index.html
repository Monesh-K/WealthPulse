  <script>
    // Service Worker registration with one-time cache purge for v7 upgrade
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const SW_VERSION = 'v8';
          if (localStorage.getItem('sw_ver') !== SW_VERSION) {
            // One-time: unregister old SW and purge stale caches
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const reg of regs) await reg.unregister();
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
            localStorage.setItem('sw_ver', SW_VERSION);
            console.log('[SW] Purged old caches for', SW_VERSION);
          }
          const reg = await navigator.serviceWorker.register('/sw.js');
          console.log('[SW] Registered:', reg.scope);
        } catch (err) {
          console.warn('[SW] Registration failed:', err);
        }
      });
    }
  </script>
